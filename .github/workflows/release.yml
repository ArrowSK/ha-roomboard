name: Release

on:
  push:
    branches:
      - main
    paths:
      - "dist/ha-roomboard.js"
      - "package.json"
      - "CHANGELOG.md"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate release candidate
        run: npm run check

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build release notes from changelog
        shell: python
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          from pathlib import Path
          import os, re

          version = os.environ["VERSION"]
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(
              rf"^## {re.escape(version)}(?:\s+-[^\n]*)?\n(.*?)(?=^## |\Z)",
              text,
              flags=re.MULTILINE | re.DOTALL,
          )
          notes = match.group(1).strip() if match else f"HA Roomboard {version}"
          Path("/tmp/release-notes.md").write_text(notes + "\n", encoding="utf-8")

      - name: Publish or repair GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists; ensuring the HACS plugin asset is attached."
            gh release upload "$TAG" dist/ha-roomboard.js --clobber
          else
            gh release create "$TAG" \
              dist/ha-roomboard.js \
              --target "main" \
              --title "HA Roomboard $VERSION" \
              --notes-file /tmp/release-notes.md
          fi

      - name: Verify HACS release asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fx 'ha-roomboard.js'
