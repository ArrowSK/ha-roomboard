name: Apply automation edit-first UX

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/roomboard-automation-edit-ux.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply focused automation interaction update
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"Expected source block not found: {label}")
              return text.replace(old, new, 1)

          js_path = Path("dist/ha-roomboard.js")
          js = js_path.read_text()
          js = replace_once(
              js,
              'const ROOMBOARD_VERSION = "0.3.0";',
              'const ROOMBOARD_VERSION = "0.3.1";',
              "runtime version",
          )
          js = replace_once(
              js,
              '''const DIRECT_TOGGLE_DOMAINS = new Set([\n  "light",\n  "switch",\n  "fan",\n  "input_boolean",\n  "automation",\n]);''',
              '''const DIRECT_TOGGLE_DOMAINS = new Set([\n  "light",\n  "switch",\n  "fan",\n  "input_boolean",\n]);''',
              "automation direct-toggle removal",
          )
          js = replace_once(
              js,
              '''function displayActionState(hass, item) {\n  const stateObj = hass?.states?.[item.entity_id];\n  if (isUnavailableState(stateObj)) return "Unavailable";\n  if (item.domain === "scene") return "Tap to run";\n  if (item.domain === "automation") return stateObj.state === "on" ? "Enabled" : "Disabled";\n  return displayState(hass, item.entity_id);\n}\n''',
              '''function displayActionState(hass, item) {\n  const stateObj = hass?.states?.[item.entity_id];\n  if (isUnavailableState(stateObj)) return "Unavailable";\n  if (item.domain === "scene") return "Tap to run";\n  if (item.domain === "automation") return stateObj.state === "on" ? "Enabled" : "Disabled";\n  return displayState(hass, item.entity_id);\n}\n\nfunction automationEditorPath(hass, entityId) {\n  const automationId = hass?.states?.[entityId]?.attributes?.id;\n  return automationId\n    ? `/config/automation/edit/${encodeURIComponent(automationId)}`\n    : `/config/automation/show/${entityId}`;\n}\n\nfunction automationToggleMeta(hass, entityId) {\n  const enabled = hass?.states?.[entityId]?.state === "on";\n  return {\n    enabled,\n    service: enabled ? "turn_off" : "turn_on",\n    label: enabled ? "Disable automation" : "Enable automation",\n    icon: enabled ? "mdi:toggle-switch" : "mdi:toggle-switch-off-outline",\n  };\n}\n''',
              "automation route helpers",
          )
          js = replace_once(
              js,
              '''      button, a { font: inherit; }\n      button:focus-visible,''',
              '''      button, a { font: inherit; }\n      .automation-edit {\n        color: inherit;\n        text-decoration: none;\n      }\n      .automation-toggle {\n        width: 44px;\n        height: 44px;\n        flex: 0 0 auto;\n        display: inline-flex;\n        align-items: center;\n        justify-content: center;\n        border: 0;\n        border-radius: 12px;\n        color: var(--secondary-text-color);\n        background: transparent;\n        cursor: pointer;\n      }\n      .automation-toggle[aria-pressed="true"] {\n        color: var(--primary-color);\n        background: color-mix(in srgb, var(--primary-color) 12%, transparent);\n      }\n      .automation-toggle:hover {\n        background: color-mix(in srgb, var(--primary-text-color) 8%, transparent);\n      }\n      .automation-toggle ha-icon { --mdc-icon-size: 25px; }\n      button:focus-visible,''',
              "automation control styles",
          )
          js = replace_once(
              js,
              '''  launchAssist() {\n    const tapAction = {''',
              '''  async toggleAutomationEnabled(entityId) {\n    const hass = this._hass;\n    if (!hass?.states?.[entityId]) return;\n    const meta = automationToggleMeta(hass, entityId);\n    try {\n      await hass.callService("automation", meta.service, { entity_id: entityId });\n    } catch (error) {\n      console.error("HA Roomboard automation enable/disable failed", entityId, error);\n      this.showMoreInfo(entityId);\n    }\n  }\n\n  launchAssist() {\n    const tapAction = {''',
              "shared automation toggle action",
          )

          old_tile = '''  tileHtml(item) {\n    const stateObj = this._hass?.states?.[item.entity_id];\n    const active = isActiveState(stateObj);\n    const unavailable = isUnavailableState(stateObj);\n    const icon = entityIcon(stateObj, item.domain);\n    const secondary = asArray(item.secondary)\n      .map((metric) => {\n        const metricState = this._hass?.states?.[metric.entity_id];\n        if (isUnavailableState(metricState)) return "";\n        return `<span>${escapeHtml(displayState(this._hass, metric.entity_id))}</span>`;\n      })\n      .filter(Boolean)\n      .join("");\n\n    return `\n      <article class="tile ${active ? "active" : ""} ${unavailable ? "unavailable" : ""}" data-entity="${escapeHtml(\n        item.entity_id,\n      )}">\n        <button class="tile-main" type="button" data-action="activate" data-entity="${escapeHtml(item.entity_id)}">\n          <span class="icon-wrap"><ha-icon icon="${escapeHtml(icon)}"></ha-icon></span>\n          <span class="tile-copy">\n            <span class="tile-name">${escapeHtml(item.name)}</span>\n            <span class="tile-state">${escapeHtml(displayActionState(this._hass, item))}</span>\n            ${item.device_name && item.device_name !== item.name ? `<span class="device-name">${escapeHtml(item.device_name)}</span>` : ""}\n          </span>\n        </button>\n        <div class="tile-footer">\n          <div class="metrics">${secondary}</div>\n          <button class="more" type="button" aria-label="More information for ${escapeHtml(item.name)}" data-action="more" data-entity="${escapeHtml(\n            item.entity_id,\n          )}">•••</button>\n        </div>\n      </article>`;\n  }\n'''
          new_tile = '''  tileHtml(item) {\n    const stateObj = this._hass?.states?.[item.entity_id];\n    const active = isActiveState(stateObj);\n    const unavailable = isUnavailableState(stateObj);\n    const icon = entityIcon(stateObj, item.domain);\n    const secondary = asArray(item.secondary)\n      .map((metric) => {\n        const metricState = this._hass?.states?.[metric.entity_id];\n        if (isUnavailableState(metricState)) return "";\n        return `<span>${escapeHtml(displayState(this._hass, metric.entity_id))}</span>`;\n      })\n      .filter(Boolean)\n      .join("");\n    const mainContent = `\n          <span class="icon-wrap"><ha-icon icon="${escapeHtml(icon)}"></ha-icon></span>\n          <span class="tile-copy">\n            <span class="tile-name">${escapeHtml(item.name)}</span>\n            <span class="tile-state">${escapeHtml(displayActionState(this._hass, item))}${item.domain === "automation" ? " · tap to edit" : ""}</span>\n            ${item.device_name && item.device_name !== item.name ? `<span class="device-name">${escapeHtml(item.device_name)}</span>` : ""}\n          </span>`;\n    const mainControl = item.domain === "automation"\n      ? `<a class="tile-main automation-edit" href="${escapeHtml(automationEditorPath(this._hass, item.entity_id))}" aria-label="Edit ${escapeHtml(item.name)} automation">${mainContent}</a>`\n      : `<button class="tile-main" type="button" data-action="activate" data-entity="${escapeHtml(item.entity_id)}">${mainContent}</button>`;\n    const automationToggle = item.domain === "automation"\n      ? (() => {\n          const meta = automationToggleMeta(this._hass, item.entity_id);\n          return `<button class="automation-toggle" type="button" data-automation-toggle="${escapeHtml(item.entity_id)}" aria-pressed="${meta.enabled}" aria-label="${escapeHtml(meta.label)}: ${escapeHtml(item.name)}" title="${escapeHtml(meta.label)}"><ha-icon icon="${meta.icon}"></ha-icon></button>`;\n        })()\n      : "";\n\n    return `\n      <article class="tile ${active ? "active" : ""} ${unavailable ? "unavailable" : ""}" data-entity="${escapeHtml(\n        item.entity_id,\n      )}">\n        ${mainControl}\n        <div class="tile-footer">\n          <div class="metrics">${secondary}</div>\n          <div class="tile-actions">\n            ${automationToggle}\n            <button class="more" type="button" aria-label="More information for ${escapeHtml(item.name)}" data-action="more" data-entity="${escapeHtml(\n              item.entity_id,\n            )}">•••</button>\n          </div>\n        </div>\n      </article>`;\n  }\n'''
          js = replace_once(js, old_tile, new_tile, "room automation tile interaction")

          js = replace_once(
              js,
              '''    const details = this.shadowRoot.querySelector("details.unavailable-section");''',
              '''    this.shadowRoot.querySelectorAll("button[data-automation-toggle]").forEach((button) => {\n      button.addEventListener("click", (event) => {\n        const entityId = event.currentTarget.dataset.automationToggle;\n        this.toggleAutomationEnabled(entityId);\n      });\n    });\n    const details = this.shadowRoot.querySelector("details.unavailable-section");''',
              "room automation toggle binding",
          )
          js = replace_once(
              js,
              '''        .metrics span { white-space: nowrap; }\n        .more {''',
              '''        .metrics span { white-space: nowrap; }\n        .tile-actions {\n          display: flex;\n          align-items: center;\n          gap: 4px;\n          margin-left: auto;\n        }\n        .more {''',
              "room footer action layout",
          )

          old_action = '''  actionHtml(item) {\n    const stateObj = this._hass?.states?.[item.entity_id];\n    const active = item.domain === "automation" && stateObj?.state === "on";\n    return `\n      <article class="action-card ${active ? "active" : ""}">\n        <button class="action-main" type="button" data-global-action="activate" data-entity="${escapeHtml(item.entity_id)}">\n          <span class="action-icon"><ha-icon icon="${escapeHtml(item.icon || entityIcon(stateObj, item.domain))}"></ha-icon></span>\n          <span class="action-copy">\n            <strong>${escapeHtml(item.name)}</strong>\n            <span>${escapeHtml(displayActionState(this._hass, item))}</span>\n          </span>\n        </button>\n        <button class="action-more" type="button" aria-label="More information for ${escapeHtml(item.name)}" data-global-action="more" data-entity="${escapeHtml(item.entity_id)}">•••</button>\n      </article>`;\n  }\n'''
          new_action = '''  actionHtml(item) {\n    const stateObj = this._hass?.states?.[item.entity_id];\n    const active = item.domain === "automation" && stateObj?.state === "on";\n    if (item.domain === "automation") {\n      const meta = automationToggleMeta(this._hass, item.entity_id);\n      return `\n        <article class="action-card ${active ? "active" : ""}">\n          <a class="action-main automation-edit" href="${escapeHtml(automationEditorPath(this._hass, item.entity_id))}" aria-label="Edit ${escapeHtml(item.name)} automation">\n            <span class="action-icon"><ha-icon icon="${escapeHtml(item.icon || entityIcon(stateObj, item.domain))}"></ha-icon></span>\n            <span class="action-copy">\n              <strong>${escapeHtml(item.name)}</strong>\n              <span>${escapeHtml(displayActionState(this._hass, item))} · tap to edit</span>\n            </span>\n          </a>\n          <div class="action-controls">\n            <button class="automation-toggle" type="button" data-automation-toggle="${escapeHtml(item.entity_id)}" aria-pressed="${meta.enabled}" aria-label="${escapeHtml(meta.label)}: ${escapeHtml(item.name)}" title="${escapeHtml(meta.label)}"><ha-icon icon="${meta.icon}"></ha-icon></button>\n            <button class="action-more" type="button" aria-label="More information for ${escapeHtml(item.name)}" data-global-action="more" data-entity="${escapeHtml(item.entity_id)}">•••</button>\n          </div>\n        </article>`;\n    }\n    return `\n      <article class="action-card">\n        <button class="action-main" type="button" data-global-action="activate" data-entity="${escapeHtml(item.entity_id)}">\n          <span class="action-icon"><ha-icon icon="${escapeHtml(item.icon || entityIcon(stateObj, item.domain))}"></ha-icon></span>\n          <span class="action-copy">\n            <strong>${escapeHtml(item.name)}</strong>\n            <span>${escapeHtml(displayActionState(this._hass, item))}</span>\n          </span>\n        </button>\n        <button class="action-more" type="button" aria-label="More information for ${escapeHtml(item.name)}" data-global-action="more" data-entity="${escapeHtml(item.entity_id)}">•••</button>\n      </article>`;\n  }\n'''
          js = replace_once(js, old_action, new_action, "global automation card interaction")

          js = replace_once(
              js,
              '''      } else if (domain === "automation") {\n        await this._hass.callService("automation", "toggle", { entity_id: entityId });\n      } else {''',
              '''      } else if (domain === "automation") {\n        await this.toggleAutomationEnabled(entityId);\n      } else {''',
              "global automation compatibility action",
          )
          js = replace_once(
              js,
              '''    const assist = this.shadowRoot.querySelector("button[data-assist]");''',
              '''    this.shadowRoot.querySelectorAll("button[data-automation-toggle]").forEach((button) => {\n      button.addEventListener("click", (event) => {\n        const entityId = event.currentTarget.dataset.automationToggle;\n        this.toggleAutomationEnabled(entityId);\n      });\n    });\n    const assist = this.shadowRoot.querySelector("button[data-assist]");''',
              "overview automation toggle binding",
          )
          js = replace_once(
              js,
              '''        .action-more {\n          width: 44px;''',
              '''        .action-controls {\n          min-height: 104px;\n          display: flex;\n          flex-direction: column;\n          align-items: center;\n          justify-content: flex-end;\n          gap: 2px;\n          padding: 4px 0 6px;\n        }\n        .action-controls .action-more {\n          align-self: auto;\n          justify-self: auto;\n          margin-bottom: 0;\n        }\n        .action-more {\n          width: 44px;''',
              "overview automation control layout",
          )
          js_path.write_text(js)

          package_path = Path("package.json")
          package = json.loads(package_path.read_text())
          package["version"] = "0.3.1"
          package_path.write_text(json.dumps(package, indent=2) + "\n")

          validate_path = Path("scripts/validate.mjs")
          validate = validate_path.read_text()
          validate = replace_once(
              validate,
              '''  'prefers-reduced-motion',\n];''',
              '''  'prefers-reduced-motion',\n  'automationEditorPath',\n  '/config/automation/edit/',\n  '/config/automation/show/',\n  'data-automation-toggle',\n  'toggleAutomationEnabled',\n];''',
              "validation markers",
          )
          validate_path.write_text(validate)

          behavior_path = Path("scripts/behavior.test.mjs")
          behavior = behavior_path.read_text()
          behavior = replace_once(
              behavior,
              '''  "automation.bedroom_night_mode": {\n    state: "on",\n    attributes: { friendly_name: "Bedroom Night Mode" },\n  },''',
              '''  "automation.bedroom_night_mode": {\n    state: "on",\n    attributes: { friendly_name: "Bedroom Night Mode" },\n  },''',
              "fallback automation state",
          )
          behavior = replace_once(
              behavior,
              '''  "automation.hall_lights": {\n    state: "on",\n    attributes: { friendly_name: "Hall Lights" },\n  },''',
              '''  "automation.hall_lights": {\n    state: "on",\n    attributes: { friendly_name: "Hall Lights", id: "hall-lights-automation" },\n  },''',
              "editable automation id",
          )
          behavior = replace_once(
              behavior,
              '''assert.match(roomCard.shadowRoot.innerHTML, /min-height: 44px/);\n''',
              '''assert.match(roomCard.shadowRoot.innerHTML, /min-height: 44px/);\nassert.match(\n  roomCard.shadowRoot.innerHTML,\n  /href="\\/config\\/automation\\/show\\/automation\\.bedroom_night_mode"/,\n  "room automation without an id should open the Home Assistant fallback configuration page",\n);\nassert.match(roomCard.shadowRoot.innerHTML, /data-automation-toggle="automation\\.bedroom_night_mode"/);\n''',
              "room automation interaction tests",
          )
          behavior = replace_once(
              behavior,
              '''assert.match(overviewCard.shadowRoot.innerHTML, /Hall Lights/);\n''',
              '''assert.match(overviewCard.shadowRoot.innerHTML, /Hall Lights/);\nassert.match(\n  overviewCard.shadowRoot.innerHTML,\n  /href="\\/config\\/automation\\/edit\\/hall-lights-automation"/,\n  "automation cards should open the native Home Assistant editor when attributes.id is available",\n);\nassert.match(overviewCard.shadowRoot.innerHTML, /data-automation-toggle="automation\\.hall_lights"/);\n''',
              "overview automation interaction tests",
          )
          behavior = replace_once(
              behavior,
              '''assert.deepEqual(serviceCalls.at(-1), ["automation", "toggle", { entity_id: "automation.hall_lights" }]);\n''',
              '''assert.deepEqual(serviceCalls.at(-1), ["automation", "turn_off", { entity_id: "automation.hall_lights" }]);\nstates["automation.hall_lights"].state = "off";\nawait overviewCard.toggleAutomationEnabled("automation.hall_lights");\nassert.deepEqual(serviceCalls.at(-1), ["automation", "turn_on", { entity_id: "automation.hall_lights" }]);\nstates["automation.hall_lights"].state = "on";\n''',
              "explicit automation enable disable service tests",
          )
          behavior_path.write_text(behavior)

          readme_path = Path("README.md")
          readme = readme_path.read_text()
          readme = replace_once(
              readme,
              '''The default interaction model is deliberately conservative. Lights, switches, fans, input booleans, and Area-assigned automations toggle directly. Scenes run directly. Other device types open Home Assistant's More Info dialog rather than guessing a command that could be inappropriate for the device.''',
              '''The interaction model tries to make the obvious tap do the human thing. Lights, switches, fans, and input booleans toggle directly, while scenes run immediately. Automations are treated as things you are likely to inspect or tune: tap the automation card to open Home Assistant's editor, use the dedicated enable/disable switch when you want to pause or resume it, and use the three-dot button for More Info. Other device types still open Home Assistant's More Info dialog rather than guessing a command that could be inappropriate for the device.''',
              "README interaction model",
          )
          readme = replace_once(
              readme,
              '''- Selecting a scene calls `scene.turn_on`.\n- Selecting an automation toggles whether that automation is enabled or disabled. It does **not** manually run the automation's actions.\n- The three-dot button opens Home Assistant More Info.\n- Area-assigned scenes and automations can also appear as ordinary room tiles.''',
              '''- Tap a scene to run it with `scene.turn_on`.\n- Tap the body of an automation card to open Home Assistant's native automation editor. If the entity exposes an automation `id`, Roomboard opens `/config/automation/edit/<id>`; otherwise it falls back to Home Assistant's `/config/automation/show/<entity_id>` page.\n- Use the dedicated switch button on the automation card to enable or disable it. This never runs the automation's actions.\n- Use the three-dot button for Home Assistant More Info.\n- The same interaction model is used for Area-assigned automations inside room views.\n\nAn automation is usually something you want to understand before changing. Separating **edit**, **enable/disable**, and **More Info** makes the dashboard faster to read and much harder to mis-tap.''',
              "README scenes and automations section",
          )
          readme_path.write_text(readme)

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text()
          changelog = replace_once(
              changelog,
              '''All notable changes to HA Roomboard are documented here.\n\n''',
              '''All notable changes to HA Roomboard are documented here.\n\n## 0.3.1 - 2026-08-16\n\n- Make the automation card itself an **edit** action, matching the way people naturally open an automation to inspect or change it.\n- Follow Home Assistant's native automation routes: use `/config/automation/edit/<id>` when an automation ID is available and fall back to `/config/automation/show/<entity_id>` otherwise.\n- Add a separate, accessible 44 px enable/disable control so pausing an automation is deliberate rather than an accidental card tap.\n- Keep the three-dot button dedicated to More Info and keep scene taps dedicated to running scenes.\n- Apply the same edit/toggle/More Info model to Area-assigned automations in room views.\n- Extend tests and repository validation around editor routing and explicit `automation.turn_on` / `automation.turn_off` behavior.\n- Rewrite the automation documentation around the actual human interaction instead of implementation details.\n\n''',
              "0.3.1 changelog",
          )
          changelog_path.write_text(changelog)
          PY

      - name: Validate JavaScript and behavior
        run: npm run check

      - name: Commit directly to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/ha-roomboard.js package.json scripts/validate.mjs scripts/behavior.test.mjs README.md CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Roomboard 0.3.1: edit-first automation controls"
          git push origin HEAD:main
