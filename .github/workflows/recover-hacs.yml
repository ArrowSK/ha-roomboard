name: Recover HACS release detection

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/recover-hacs.yml"

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepare 0.4.1 HACS recovery release
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          js = Path("dist/ha-roomboard.js")
          text = js.read_text(encoding="utf-8")
          old = 'const ROOMBOARD_VERSION = "0.4.0";'
          new = 'const ROOMBOARD_VERSION = "0.4.1";'
          if old not in text:
              raise SystemExit("Unexpected Roomboard runtime version")
          js.write_text(text.replace(old, new, 1), encoding="utf-8")

          pkg_path = Path("package.json")
          pkg = json.loads(pkg_path.read_text(encoding="utf-8"))
          pkg["version"] = "0.4.1"
          pkg_path.write_text(json.dumps(pkg, indent=2) + "\n", encoding="utf-8")

          hacs_path = Path("hacs.json")
          hacs = json.loads(hacs_path.read_text(encoding="utf-8"))
          hacs["render_readme"] = True
          hacs_path.write_text(json.dumps(hacs, indent=2) + "\n", encoding="utf-8")

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text(encoding="utf-8")
          marker = "## Unreleased\n\n"
          entry = """## 0.4.1 - 2026-08-17\n\n- Repair HACS version detection after the initial 0.4.0 release packaging change.\n- Publish a fresh semantic release from the default `main` branch with `ha-roomboard.js` attached as the release asset HACS expects.\n- Keep the dashboard implementation and 0.4.0 UX behaviour unchanged; this is a packaging/release recovery only.\n- Add `render_readme` to the HACS manifest to match conventional Dashboard repository metadata.\n\n"""
          if "## 0.4.1" not in changelog:
              changelog = changelog.replace(marker, marker + entry, 1)
          changelog_path.write_text(changelog, encoding="utf-8")
          PY

          npm run check

          git config user.name "ArrowSK"
          git config user.email "56678503+ArrowSK@users.noreply.github.com"
          git add dist/ha-roomboard.js package.json hacs.json CHANGELOG.md
          git commit -m "fix: restore HACS semantic release detection"
          git push origin main
